name: Bug report
description: Spaces behaves differently from how it is documented
title: "Bug: "
labels: ["bug"]
body:
  - type: input
    id: spaces-version
    attributes:
      label: Spaces version
      description: "Settings → Community plugins → Spaces."
      placeholder: "0.3.0"
    validations:
      required: true

  - type: dropdown
    id: isolated
    attributes:
      label: Does it still happen with only Spaces enabled?
      description: "Settings → Community plugins, turn the others off, try again."
      options:
        - "Yes, it still happens with only Spaces enabled"
        - "No, it goes away when I disable another plugin"
        - "I have not tried yet"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a space called Garden
        2. Pin it to a folder
        3. Open Settings → Spaces
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true

  - type: textarea
    id: debug-info
    attributes:
      label: Obsidian debug info
      description: "Run **Show debug info** from the command palette and paste the result."
      render: text
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: >-
        Optional. Press Ctrl+Shift+I (Cmd+Option+I on macOS), open the Console
        tab, reproduce the problem, and paste anything red that mentions Spaces.
      render: text
    validations:
      required: false
