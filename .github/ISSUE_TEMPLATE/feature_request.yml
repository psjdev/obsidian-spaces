name: Feature request
description: Something you want Spaces to do that it does not do yet
title: "Feature: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checked-readme
    attributes:
      label: Before you file
      options:
        - label: "I have checked the README and this is not already possible."
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: "The task, and what makes it awkward today."
      placeholder: >-
        I keep a space per client. When I switch to one I still have to scroll
        the file tree to find this week's notes.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
      description: "Optional. A rough shape is fine."
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: How do you work around it now?
      description: "Optional."
    validations:
      required: false
